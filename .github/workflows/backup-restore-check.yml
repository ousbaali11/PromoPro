name: Vérification de restauration

# Chaque semaine, le dernier dump publié par « Sauvegarde de la base » est
# restauré dans une base PostgreSQL JETABLE (service du job, jamais Railway),
# puis les tables clés sont contrôlées : un backup jamais restauré n'est pas
# vérifié. Déclenchement manuel possible, avec au choix l'identifiant d'un run
# de sauvegarde précis (ex. un run « auto-test »).

on:
  schedule:
    - cron: "0 4 * * 0" # dimanche 04:00 UTC, après la sauvegarde de 03:00
  workflow_dispatch:
    inputs:
      run_id:
        description: "Identifiant du run de sauvegarde à vérifier (vide = dernier run réussi)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read # lecture des artefacts d'un autre run

env:
  # Tables qui doivent contenir au moins une ligne après restauration
  TABLES_OBLIGATOIRES: users biens paiements

jobs:
  restauration:
    name: pg_restore sur base jetable + contrôle des tables
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: postgres:18
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: verif
          POSTGRES_PASSWORD: verif
          POSTGRES_DB: verif
        options: >-
          --health-cmd "pg_isready -U verif"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Run de sauvegarde à vérifier
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const demande = `${{ inputs.run_id || '' }}`.trim();
            if (demande) {
              core.setOutput("run_id", demande);
              core.info(`Run demandé : ${demande}`);
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "backup-db.yml",
              status: "success",
              per_page: 1,
            });
            const run = data.workflow_runs[0];
            if (!run) core.setFailed("Aucun run de sauvegarde réussi : rien à vérifier.");
            else {
              core.setOutput("run_id", String(run.id));
              core.info(`Dernier run de sauvegarde réussi : ${run.id} (${run.created_at})`);
            }

      - name: Téléchargement du dump
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: sauvegarde-postgres-*
          path: dumps
          merge-multiple: true

      - name: Restauration et contrôle (base jetable uniquement)
        env:
          DATABASE_URL: postgresql://verif:verif@postgres:5432/verif
        run: |
          DUMP=$(ls dumps/*.dump | head -n 1)
          test -n "$DUMP" || { echo "::error::Aucun fichier .dump dans l'artefact"; exit 1; }
          echo "Dump vérifié : $DUMP (run ${{ steps.source.outputs.run_id }})" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/db-restore-check.sh "$DUMP" $TABLES_OBLIGATOIRES | tee -a "$GITHUB_STEP_SUMMARY"
