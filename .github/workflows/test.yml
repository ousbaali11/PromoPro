name: Tests

# Signal rapide avant que Railway ne déploie : build, tests unitaires et
# tests de bout en bout sur une base SQLite jetable (jamais la production).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    # Lint + build + unitaires (~4 min) puis 213 tests de bout en bout en série (~34 min en local,
    # davantage sur un runner partagé à 2 cœurs) : la limite de 35 min a annulé le run du 1er octobre
    # 2026 au milieu de la suite (eeb3036). Marge large ; la suite reste à un seul worker car des specs
    # dépendent des données laissées par les précédents (ordre alphabétique).
    timeout-minutes: 75
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Aucune DATABASE_URL : mode SQLite local, garanti hors production.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Contrastes WCAG de la palette
        run: npm run check:contrast

      - name: Build
        run: npm run build

      - name: Tests unitaires
        run: npm run test

      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout (SQLite jetable)
        run: npm run test:e2e

      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
